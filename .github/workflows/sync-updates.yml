# Publishes the standalone /updates/ page to PediaMedAI/pediamedai-updates,
# which owns the pediamedai.com custom domain in the two-repo split (this
# repo serves the full site at the bare pediamedai.github.io URL instead —
# see layouts/updates/list.html for the standalone-mode link handling).
name: Sync simplified page to pediamedai-updates

on:
  push:
    branches:
      - redesign

  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      # Keep in sync with hugo.yml — same site, same build tooling.
      HUGO_VERSION: 0.163.1
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O "${{ runner.temp }}/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb" \
          && sudo dpkg -i "${{ runner.temp }}/hugo.deb"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # standaloneUpdates=true switches layouts/updates/list.html's
      # internal links (home, full log, workshops, card hrefs, canonical,
      # footer note) from same-site-relative to absolute links pointing
      # at pediamedai.github.io — this build's output becomes the site
      # ROOT of a different domain, not a /updates/ subpage of this one.
      - name: Build the standalone /updates/ page
        env:
          HUGO_PARAMS_STANDALONEUPDATES: "true"
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "https://pediamedai.com/"

      # Plain `git clone` rather than actions/checkout: pediamedai-updates
      # starts out with zero commits (no resolvable ref), which
      # actions/checkout errors on. A clone of an empty repo succeeds and
      # leaves you on an unborn default branch, ready for the first
      # commit below — no manual bootstrap commit required on your end.
      #
      # Only index.html is touched — a repo-managed CNAME file (written
      # by GitHub when a custom domain is configured in Settings → Pages)
      # or any other file in the target repo is left alone.
      - name: Publish if changed
        env:
          TOKEN: ${{ secrets.SYNC_REPO_TOKEN }}
        run: |
          git clone "https://x-access-token:${TOKEN}@github.com/PediaMedAI/pediamedai-updates.git" pediamedai-updates
          cd pediamedai-updates
          git checkout main 2>/dev/null || git checkout -b main
          cp ../public/updates/index.html ./index.html
          git config user.name "pediamedai-bot"
          git config user.email "actions@github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "No changes — simplified page is already up to date."
          else
            git commit -m "Sync from pediamedai.github.io@${GITHUB_SHA}"
            git push origin main
          fi
