# Hero pose-overlay artifact data — read by
# themes/pediamedai-frontier/layouts/partials/hero-pose-overlay.html.
#
# Coordinates are in the SVG viewBox (540x540).
# IMPORTANT: the y-coordinate field is named `cy` (not `y`) because
# YAML 1.1 — used by Hugo's go-yaml — interprets a bare `y` key as
# the boolean `true`, which silently zeros the y-coordinate. `cx`
# mirrors that for symmetry.
#
# Confidence is a float in [0, 1]; the partial encodes it visually:
#   high (>= 0.85) → accent color, tight ring
#   low  (<  0.85) → signal color, wider ring
#
# `label` is shown in the bar panel when bar: true.

keypoints:
  - { id: head,  cx: 270, cy: 108, conf: 0.97, bar: true,  label: "HEAD"  }
  - { id: neck,  cx: 270, cy: 173, conf: 0.95 }
  - { id: lsh,   cx: 216, cy: 194, conf: 0.93, bar: true,  label: "LSH"   }
  - { id: rsh,   cx: 324, cy: 194, conf: 0.94, bar: true,  label: "RSH"   }
  - { id: lel,   cx: 173, cy: 270, conf: 0.88, bar: true,  label: "LEL"   }
  - { id: rel,   cx: 367, cy: 270, conf: 0.86, bar: true,  label: "REL"   }
  - { id: lwr,   cx: 151, cy: 346, conf: 0.79, bar: true,  label: "LWR"   }
  - { id: rwr,   cx: 389, cy: 346, conf: 0.74, bar: true,  label: "RWR"   }
  - { id: torso, cx: 270, cy: 270, conf: 0.96, bar: true,  label: "TORSO" }
  - { id: lhp,   cx: 238, cy: 335, conf: 0.92 }
  - { id: rhp,   cx: 302, cy: 335, conf: 0.92 }
  - { id: lkn,   cx: 221, cy: 411, conf: 0.90 }
  - { id: rkn,   cx: 319, cy: 411, conf: 0.89 }
  - { id: lan,   cx: 211, cy: 486, conf: 0.83 }
  - { id: ran,   cx: 329, cy: 486, conf: 0.81 }

# Skeleton bone connections — reference keypoint ids by name.
bones:
  - [head,  neck]
  - [neck,  lsh]
  - [neck,  rsh]
  - [lsh,   lel]
  - [rsh,   rel]
  - [lel,   lwr]
  - [rel,   rwr]
  - [neck,  torso]
  - [torso, lhp]
  - [torso, rhp]
  - [lhp,   lkn]
  - [rhp,   rkn]
  - [lkn,   lan]
  - [rkn,   ran]

# Bar-panel order (top to bottom) — each entry is a keypoint id that
# must exist in the keypoints list above with `bar: true`.
bar_order: [head, torso, lsh, rsh, lel, rel, lwr, rwr]
