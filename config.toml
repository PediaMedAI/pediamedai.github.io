baseURL = "https://pediamedai.github.io/"
relativeURLs = "True"
languageCode = "en-us"
title = "PediaMedAI"
themesDir = "themes"
theme = "pediamedai-modern"
sectionPagesMenu = "content"
enableEmoji = true

[markup.goldmark.renderer]
  unsafe = true

[params]
  contact_email = "contact@pediamedai.com"
  google_analytics_id=""
  google_tag_manager_id = "" 

 [params.homepage]
  show_call_box = true

 [params.logo]
  mobile = '/images/home_logo.png'
  desktop = '/images/home_logo.png'
  desktop_height = "48px"
  mobile_height = "24px"

  [params.homepage_meta_tags]
    meta_description = "Interpretable AI that helps pediatricians detect developmental conditions earlier—starting with autism and gait. We build AI tools clinicians can trust."
    meta_og_title = "PediaMed AI — Interpretable AI for Pediatric Diagnosis & Early Intervention"
    meta_og_type = "website"
    meta_og_url = "https://www.pediamedai.com/"
    meta_og_image = "/static/favicon.png"
    meta_og_description = "Interpretable AI that helps pediatricians detect developmental conditions earlier. Partners: Shenzhen Children's Hospital, NYU, UVA, UIUC. ICLR 2025 & CVPR 2026."
    meta_twitter_card = "summary"
    meta_twitter_site = "@pediamedai"
    meta_twitter_creator = "@pediamedai"

