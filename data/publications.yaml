# PediaMed AI publications & preprints. Single source of truth for the
# Publications page (full archive) AND the research-page "Selected Works"
# grid (entries marked featured: true).
#
# Fields:
#   year, venue, title, authors, url   — required.
#   tags                                — list, used by /publications/ filter.
#   featured                            — bool, surfaces on /research/ Selected Works.
#   tagClass                            — "" | "accent" | "signal", venue-color hint.
#   bibtex                              — multi-line BibTeX entry; surfaced via
#                                         the "Cite" disclosure on /publications/.
#   repo                                — optional "owner/name" GitHub path; renders
#                                         a "Code ↗" chip next to "Cite" on the
#                                         publications page so researchers can grab
#                                         the implementation without hopping pages.
#   arxiv                               — optional arXiv id (e.g. "2311.12320");
#                                         emitted as a PropertyValue identifier
#                                         on the ScholarlyArticle JSON-LD so
#                                         search engines can dedupe across the
#                                         arXiv canonical and the venue PDF.
