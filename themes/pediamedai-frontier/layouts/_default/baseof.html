<!doctype html>
<html lang="{{ .Site.LanguageCode | default "en" }}">
  {{- partial "head.html" . }}
  <body>
    {{- partial "header.html" . }}
    <main id="main">
      {{- block "main" . }}{{ end }}
    </main>
    {{- /* Footer is fully page-invariant (Site.Params + now() + 7 JS
           pipelines), so partialCached avoids re-running the resource
           lookups for every page in the build. */ -}}
    {{- partialCached "footer.html" . }}
  </body>
</html>
