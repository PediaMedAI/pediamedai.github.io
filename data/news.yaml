# Lab updates timeline — single source of truth for the public Updates
# page (/updates/, layouts/updates/list.html — the single latest entry
# only), the hidden full site's own "Updates" section (latest 4, see
# layouts/pmai-x7k2q9/list.html), and its full log on
# /pmai-x7k2q9/about/#updates. Newest first; templates re-sort by
# `date` desc so ordering here is a convention, not a requirement.
#
# Fields:
#   date     (required)  ISO "YYYY-MM-DD" string (keep it quoted).
#                        Used for <time datetime> and sorting.
#   display  (optional)  Human label when the honest precision is
#                        coarser than a day (e.g. "2023") — avoids
#                        implying a day-level date we don't have.
#   title    (required)  One sentence, sentence case, no trailing period.
#   url      (optional)  Internal path ("/pmai-x7k2q9/cvpr/") or absolute URL.
#   body     (optional)  List of paragraph strings — a longer narrative
#                        write-up. Only the /updates/ page reads this
#                        (the single latest entry, in full); the hidden
#                        site's strip and full log only ever use
#                        `title` and are unaffected by its presence.
#
# Only verifiable lab events belong here — no aspirational entries.
- date: "2026-06-25"
  title: "\"Decoding Children's Gait Behavior\" accepted to ECCV 2026"
  url: "https://pediamedai.com/ChildrenGait/"
  body:
    - "Our paper “Decoding Children’s Gait Behavior” has been accepted to the European Conference on Computer Vision (ECCV 2026), a collaboration with the Rehg Lab and partner institutions — Y. Shen, B. Li, M. Huang, Y. Liu, X. Cao, J. Jin, Z. Li, A. Liu, J. Kim, J. Zhu, F. Lan, J. Cao, J. Chen, I. Lourentzou, and J. M. Rehg."
    - "The paper introduces one of the first large multi-camera video repositories of children with developmental motor conditions, together with new methods for detecting subtle gait abnormalities directly from video — work that sits alongside the lab’s broader effort on computer vision for children’s health and development."

