  "IJCAI 2022 · AggPose"
  "ICASSP 2023 · ViTASD"
  "UAI 2023 · LRFormer"
  "WACV 2024 · MLLM Survey"
  "ICLR 2025 · AI4CHL Workshop"

-}}
<div class="ticker" aria-label="Recent publications and workshops">

  </div>
</div>
