# Workshops — single source of truth for the summary cards shown on the
# hidden full site's own homepage-equivalent (#workshops, see
# layouts/pmai-x7k2q9/list.html) and its /pmai-x7k2q9/workshops/ list.
# Editing here updates both at once. (The real site homepage,
# layouts/index.html, doesn't use this file at all — see data/news.yaml
# instead.)
#
# The canonical workshop pages (with full detail) live in
# content/pmai-x7k2q9/cvpr/_index.md (CV4CHL) and
# content/pmai-x7k2q9/pages/iclr.md (AI4CHL); this file only holds the
# card-level summary each surface renders via partials/card.html.
# Order is display order (upcoming first).
#
# Fields:
#   href        (required)  internal path to the workshop page.
#   image       (required)  card image, relative to the theme's img/ dir.
#   imageAlt    (required)  alt text for the image.
#   status      (required)  short badge text, e.g. "Planning" / "Done".
#   statusClass (required)  tag colour class: "accent" (upcoming),
#                           "signal", or "" (neutral / past).
#   label       (required)  mono meta line — venue · date · city.
#   title       (required)  card heading (inline HTML allowed).
#   desc        (required)  one- or two-sentence summary.
#   cta         (required)  arrow-cell call-to-action text.
- href: "/pmai-x7k2q9/cvpr/"
  image: "img/workshops/cv4chl_bg.jpg"
  imageAlt: "CVPR 2026 CV4CHL workshop background"
  status: "Planning"
  statusClass: "accent"
  label: "CVPR · June 2026 · Denver"
  title: "CVPR 2026 · Computer Vision for Children (CV4CHL)"
  desc: "Workshop on computer vision for children’s development, health, and education. Hosting the Children’s Gait Competition."
  cta: "Workshop site"

- href: "/pmai-x7k2q9/iclr/"
  image: "img/workshops/iclr_workshop/iclr_1.jpg"
  imageAlt: "ICLR 2025 AI4CHL workshop"
  status: "Done"
  statusClass: ""
  label: "ICLR · 2025 · Singapore"
  title: "ICLR 2025 · AI for Children (AI4CHL)"
  desc: "Workshop bringing pediatricians, psychologists, educators, and AI researchers together. Recap and gallery inside."
  cta: "Workshop recap"
