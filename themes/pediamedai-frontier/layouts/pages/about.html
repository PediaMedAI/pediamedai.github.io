{{ define "main" }}
{{ partial "page-head.html" (dict
  "kicker" "About"
  "title" .Title)
}}

<section class="section">
  <div class="container">
    <div class="prose">
      {{ .Content }}
    </div>

    <h2 class="h2-section">Partner institutions</h2>
    <div class="grid-4 reveal" style="align-items: center;">
      <div class="partner-tile">
        <img src="{{ "/images/partners/shenzhen-childrens-hospital.png" | relURL }}" alt="Shenzhen Children's Hospital" loading="lazy">
      </div>
      <div class="partner-tile sm">
        <img src="{{ "/images/partners/nyu.svg" | relURL }}" alt="New York University" loading="lazy">
      </div>
      <div class="partner-tile sm">
        <img src="{{ "/images/partners/uva.svg" | relURL }}" alt="University of Virginia" loading="lazy">
      </div>
      <div class="partner-tile">
        <img src="{{ "/images/partners/uiuc.png" | relURL }}" alt="University of Illinois Urbana-Champaign" loading="lazy">
      </div>
    </div>
  </div>
</section>
{{ end }}
