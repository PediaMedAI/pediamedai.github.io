# Hero pose-overlay artifact data — read by
# themes/pediamedai-frontier/layouts/partials/hero-pose-overlay.html.
#
# Coordinates are in the SVG viewBox (540x540).
# Confidence is a float in [0, 1]; the partial encodes it visually:
#   high (>= 0.85) → accent color, tight ring
#   low  (<  0.85) → signal color, wider ring
#
# `name` doubles as the bar-panel label when bar: true.

keypoints:
  - { id: head,  x: 270, y: 108, conf: 0.97, bar: true,  label: "HEAD"  }
  - { id: neck,  x: 270, y: 173, conf: 0.95 }
  - { id: lsh,   x: 216, y: 194, conf: 0.93, bar: true,  label: "LSH"   }
  - { id: rsh,   x: 324, y: 194, conf: 0.94, bar: true,  label: "RSH"   }
  - { id: lel,   x: 173, y: 270, conf: 0.88, bar: true,  label: "LEL"   }
  - { id: rel,   x: 367, y: 270, conf: 0.86, bar: true,  label: "REL"   }
  - { id: lwr,   x: 151, y: 346, conf: 0.79, bar: true,  label: "LWR"   }
  - { id: rwr,   x: 389, y: 346, conf: 0.74, bar: true,  label: "RWR"   }
  - { id: torso, x: 270, y: 270, conf: 0.96, bar: true,  label: "TORSO" }
  - { id: lhp,   x: 238, y: 335, conf: 0.92 }
  - { id: rhp,   x: 302, y: 335, conf: 0.92 }
  - { id: lkn,   x: 221, y: 411, conf: 0.90 }
  - { id: rkn,   x: 319, y: 411, conf: 0.89 }
  - { id: lan,   x: 211, y: 486, conf: 0.83 }
  - { id: ran,   x: 329, y: 486, conf: 0.81 }

# Skeleton bone connections — reference keypoint ids by name.
bones:
  - [head,  neck]
  - [neck,  lsh]
  - [neck,  rsh]
  - [lsh,   lel]
  - [rsh,   rel]
  - [lel,   lwr]
  - [rel,   rwr]
  - [neck,  torso]
  - [torso, lhp]
  - [torso, rhp]
  - [lhp,   lkn]
  - [rhp,   rkn]
  - [lkn,   lan]
  - [rkn,   ran]

# Bar-panel order (top to bottom) — each entry is a keypoint id that
# must exist in the keypoints list above with `bar: true`.
bar_order: [head, torso, lsh, rsh, lel, rel, lwr, rwr]
