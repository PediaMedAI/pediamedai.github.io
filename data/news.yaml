- date: "2026-06-04"
  title: "CV4CHL held at CVPR 2026 — Children's Gait Competition results are live"
  url: "https://pediamed.ai/cv4chl/"
  body:
    - "The CVPR 2026 Workshop on Computer Vision for Children (CV4CHL) took place June 4, 2026 in Denver, bringing pediatricians, psychologists, educators, and computer-vision researchers together around the gap in CV research for children's health, development, and education."
    - "Final results for the workshop's Children's Gait Competition — the first computer-vision challenge for pediatric gait analysis — are now published, with the full leaderboard available on Kaggle."

