# Matches the GitHub Pages custom domain so local/preview builds emit
# the same canonical + OG URLs as production (the apex — www and
# github.io both 301 here). CI still overrides via --baseURL from the
# Pages config at deploy time.
baseURL = "https://pediamedai.com/"
# BCP 47 canonical form — lowercase language, uppercase region. Feeds
# <html lang> and the RSS <language> element (config key: locale,
# the 0.158+ name for languageCode).
locale = "en-US"
title = "PediaMed AI"
themesDir = "themes"
theme = "pediamedai-frontier"
enableEmoji = true
enableGitInfo = true
disableHugoGeneratorInject = true

# Drop taxonomy lists and empty term pages so they don't appear in the
# sitemap or get indexed. (About/Contact/ICLR/Code-of-conduct used to
# live under a "pages" organizational namespace with its own permalinks
# rule; now flattened directly under content/pmai-x7k2q9/ — each with
# an explicit `type: "pages"` front-matter override so template lookup
# still finds layouts/pages/about.html etc. regardless of the flatter
# content location. See content/pmai-x7k2q9/about/index.md.)
disableKinds = ["taxonomy", "term"]

# /llms.txt — plain-text site map for LLM crawlers (llmstxt.org
# convention). Rendered by layouts/index.llms.txt on the home page.
[outputFormats.llms]
  baseName = "llms"
  mediaType = "text/plain"
  isPlainText = true

[outputs]
  home = ["html", "rss", "llms"]

[markup.goldmark.renderer]
  unsafe = true

# Smart-typography for all markdown content: straight quotes become
# curly, double-hyphens become en-dash, triple become em-dash, ellipsis
# triplets collapse. Template-literal copy is swept manually since this
# only affects rendered markdown. Defaults are explicit so future Hugo
# changes to defaults don't silently shift the output.
[markup.goldmark.extensions.typographer]
  disable = false
  leftSingleQuote = "&lsquo;"
  rightSingleQuote = "&rsquo;"
  leftDoubleQuote = "&ldquo;"
  rightDoubleQuote = "&rdquo;"
  ellipsis = "&hellip;"
  emDash = "&mdash;"
  enDash = "&ndash;"
  leftAngleQuote = "&laquo;"
  rightAngleQuote = "&raquo;"

[params]
  contact_email = "pediamedai@gmail.com"
  twitterHandle = "@pediamedai"
  metaDescription = "PediaMed AI is a pediatric AI research lab building interpretable vision and multimodal models for early detection and clinician-readable explanations."
  ogTitle = "PediaMed AI — Pediatric AI Research Lab"
  ogImage = "/images/social-card.png"

# Nav is only ever rendered on pages under /pmai-x7k2q9/ — the real
# homepage (layouts/index.html) is a standalone template that doesn't
# extend baseof.html/header.html at all. So "Home" here means "this
# section's own homepage-equivalent," not the real site root — keeping
# in-section navigation self-contained rather than bouncing visitors
# out to an unrelated page.
[[menu.main]]
  name = "Home"
  url = "/pmai-x7k2q9/"
  weight = 1

[[menu.main]]
  name = "Research"
  url = "/pmai-x7k2q9/research/"
