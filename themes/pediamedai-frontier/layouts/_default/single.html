{{ define "main" }}
{{ partial "page-head.html" (dict
  "kicker" (humanize (default "Page" .Section))
  "title" .Title
  "desc" .Description)
}}
<section class="section">
  <div class="container">
    {{ partial "page-meta.html" . }}
    <div class="prose">
      {{ .Content }}
    </div>
  </div>
</section>
{{ end }}
