# Sample workflow for building and deploying a Hugo site to GitHub Pages
name: Deploy Hugo site to Pages

on:
  push:
    branches:
      - redesign

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Keep in sync with local dev installs — version drift between CI
      # and laptops makes "works on my machine" bugs.
      HUGO_VERSION: 0.163.1
      HUGO_CACHEDIR: ${{ github.workspace }}/.hugo-cache
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O "${{ runner.temp }}/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb" \
          && sudo dpkg -i "${{ runner.temp }}/hugo.deb"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      # Hugo's module/image-processing cache — image renditions and
      # resources.GetRemote responses (GitHub star counts) carry over
      # between runs, so builds are faster and resilient to GitHub API
      # rate limits. run_id keys always miss, so restore-keys does the
      # work and the post-step saves the refreshed cache.
      - name: Restore Hugo cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.hugo-cache
          key: hugo-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            hugo-cache-${{ runner.os }}-

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      # Regression net: fail the deploy if any internal href/src in the
      # built site doesn't resolve to a file in ./public.
      - name: Check internal links
        run: python3 scripts/check_internal_links.py public

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
